# ==============================================================================
# GITHUB ACTIONS WORKFLOW: CONTROLLED CONTINUOUS DEPLOYMENT
# Purpose:
#   Performs plan review and gated apply into staging and production environments.
# Security:
#   - Enforces protected environments with manual approval for 'prod'.
#   - Uses short-lived OIDC workload identity (no static cloud keys).
# ==============================================================================
name: Controlled Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Plan
        run: |
          cd terraform/environments/${{ inputs.target_env || 'dev' }}
          terraform init
          terraform plan -out=tfplan

  apply:
    name: Gated Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env || 'dev' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Apply
        run: |
          cd terraform/environments/${{ inputs.target_env || 'dev' }}
          terraform init
          terraform apply -auto-approve
