# ==============================================================================
# KUBERNETES BASE: APPLICATION DEPLOYMENT
# Purpose:
#   Language-agnostic container deployment conforming to the platform contract.
# Security:
#   - Drops all capabilities, read-only root filesystem where feasible.
#   - Enforces execution as unprivileged user 10001:10001.
#   - Configures explicit liveness and readiness health probes.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-service
  labels:
    app.kubernetes.io/name: application-service
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: application-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: ghcr.io/org/sample-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          envFrom:
            - configMapRef:
                name: app-config
