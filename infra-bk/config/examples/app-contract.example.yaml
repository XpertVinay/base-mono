# ==============================================================================
# APPLICATION DEPLOYMENT CONTRACT (LANGUAGE & FRAMEWORK AGNOSTIC)
# Purpose:
#   Decouples application build artifacts from infrastructure orchestrators.
#   Used by both Docker Compose and Kubernetes deployment targets.
# ==============================================================================

application:
  name: "sample-service"
  version: "1.2.0"
  environment: "dev"

runtime:
  # Fully qualified immutable image tag or digest (e.g. image@sha256:...)
  image: "ghcr.io/org/sample-service:v1.2.0"
  user: "10001:10001"
  command: []
  args: []

resources:
  cpu_reservation: "250m"
  cpu_limit: "1000m"
  memory_reservation: "256Mi"
  memory_limit: "1Gi"

scaling:
  replicas: 2

ports:
  container_port: 8080
  service_port: 80
  protocol: "TCP"

health_check:
  path: "/health"
  initial_delay_seconds: 10
  interval_seconds: 15
  timeout_seconds: 5
  failure_threshold: 3

environment_variables:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "8080"
  ENABLE_METRICS: "true"

secret_references:
  - name: "app-secrets"
    key: "DATABASE_URL"
    env_var: "DATABASE_URL"
  - name: "app-secrets"
    key: "API_SECRET_KEY"
    env_var: "API_SECRET_KEY"

storage:
  enabled: false
  mount_path: "/data"
  size: "10Gi"
