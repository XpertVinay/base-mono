# ==============================================================================
# PLAYBOOK: SELF-MANAGED KUBERNETES BOOTSTRAP
# Purpose:
#   Orchestrates containerd runtime, kubeadm control-plane initialization,
#   CNI deployment, and worker node joining.
# Topology:
#   - First node acts as control-plane.
#   - Remaining nodes (if count > 1) join as worker nodes.
# ==============================================================================
---
- name: Step 1 - Configure Kubernetes prerequisites on all nodes
  hosts: all
  become: yes
  roles:
    - role: k8s_prereqs

- name: Step 2 - Initialize Kubernetes control plane
  hosts: control_plane
  become: yes
  roles:
    - role: k8s_control_plane

- name: Step 3 - Join worker nodes to cluster
  hosts: workers
  become: yes
  roles:
    - role: k8s_worker
