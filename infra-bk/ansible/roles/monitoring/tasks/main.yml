# ==============================================================================
# ANSIBLE ROLE: MONITORING - TASKS
# Purpose:
#   Installs and runs Prometheus node_exporter for host infrastructure telemetry.
# ==============================================================================
---
- name: Install prometheus-node-exporter package
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present

- name: Enable and start node_exporter service
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: yes
