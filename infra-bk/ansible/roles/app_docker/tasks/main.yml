# ==============================================================================
# ANSIBLE ROLE: APP_DOCKER - TASKS
# Purpose:
#   Deploys arbitrary language-agnostic applications via Docker Compose.
# Verification:
#   Performs active health check verification before completing play.
# ==============================================================================
---
- name: Ensure application deployment directory exists
  ansible.builtin.file:
    path: "{{ app_deploy_dir }}"
    state: directory
    mode: '0755'

- name: Render application docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Pull and start application containers
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ app_deploy_dir }}"

- name: Wait for application container to respond healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ host_port }}{{ health_path }}"
    status_code: [200, 204]
  register: app_health_result
  until: app_health_result.status in [200, 204]
  retries: 10
  delay: 3
  ignore_errors: yes
