syntax = "proto3";

package iam;

service IAMService {
  rpc VerifyToken (VerifyTokenRequest) returns (VerifyTokenResponse);
  rpc GetUserById (GetUserRequest) returns (GetUserResponse);
}

message VerifyTokenRequest {
  string token = 1;
}

message VerifyTokenResponse {
  bool valid = 1;
  string userId = 2;
  string email = 3;
  string role = 4;
  string error = 5;
}

message GetUserRequest {
  string userId = 1;
}

message GetUserResponse {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
  bool isActive = 5;
  string createdAt = 6;
}
