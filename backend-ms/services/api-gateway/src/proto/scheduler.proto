syntax = "proto3";

package scheduler;

service SchedulerService {
  rpc ListJobs (ListJobsRequest) returns (ListJobsResponse);
  rpc CreateJob (CreateJobRequest) returns (CreateJobResponse);
  rpc TriggerJob (TriggerJobRequest) returns (TriggerJobResponse);
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
  rpc Dispatch (GatewayDispatchRequest) returns (GatewayDispatchResponse);
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool status = 1;
  string service = 2;
  string version = 3;
  string timestamp = 4;
  int64 uptimeSeconds = 5;
}

message GatewayDispatchRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  string clientIp = 5;
  string correlationId = 6;
}

message GatewayDispatchResponse {
  int32 statusCode = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

message ErrorItem {
  string code = 1;
  string message = 2;
  string field = 3;
}

message PaginationMeta {
  int32 page = 1;
  int32 limit = 2;
  int64 total = 3;
  int32 total_pages = 4;
  bool has_next = 5;
}

message StandardMetaData {
  string request_id = 1;
  string timestamp = 2;
  map<string, string> debug_data = 3;
  PaginationMeta pagination = 4;
  repeated string further_steps = 5;
}

message JobData {
  string id = 1;
  string name = 2;
  string cronExpression = 3;
  string status = 4;
  string lastRunAt = 5;
  string nextRunAt = 6;
  string createdAt = 7;
}

message ListJobsRequest {}

message ListJobsData {
  repeated JobData items = 1;
}

message ListJobsResponse {
  bool status = 1;
  string message = 2;
  repeated ErrorItem errors = 3;
  StandardMetaData meta_data = 4;
  ListJobsData data = 5;
}

message CreateJobRequest {
  string name = 1;
  string cronExpression = 2;
}

message CreateJobResponse {
  bool status = 1;
  string message = 2;
  repeated ErrorItem errors = 3;
  StandardMetaData meta_data = 4;
  JobData data = 5;
}

message TriggerJobRequest {
  string id = 1;
}

message TriggerJobResponse {
  bool status = 1;
  string message = 2;
  repeated ErrorItem errors = 3;
  StandardMetaData meta_data = 4;
  JobData data = 5;
}
