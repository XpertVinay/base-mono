syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
  rpc GetStock (GetStockRequest) returns (GetStockResponse);
  rpc AddStock (AddStockRequest) returns (AddStockResponse);
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
  rpc Dispatch (GatewayDispatchRequest) returns (GatewayDispatchResponse);
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool status = 1;
  string service = 2;
  string version = 3;
  string timestamp = 4;
  int64 uptimeSeconds = 5;
}

message GatewayDispatchRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  string clientIp = 5;
  string correlationId = 6;
}

message GatewayDispatchResponse {
  int32 statusCode = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

message GetStockRequest {
  string productId = 1;
}

message InventoryItemData {
  string productId = 1;
  string sku = 2;
  int32 availableQuantity = 3;
  int32 reservedQuantity = 4;
  int32 totalQuantity = 5;
  string updatedAt = 6;
}

message GetStockResponse {
  bool status = 1;
  string message = 2;
  repeated ErrorItem errors = 3;
  StandardMetaData meta_data = 4;
  InventoryItemData data = 5;
}

message AddStockRequest {
  string productId = 1;
  string sku = 2;
  int32 quantity = 3;
}

message AddStockResponse {
  bool status = 1;
  string message = 2;
  repeated ErrorItem errors = 3;
  StandardMetaData meta_data = 4;
  InventoryItemData data = 5;
}

message ErrorItem {
  string code = 1;
  string message = 2;
  string field = 3;
}

message PaginationMeta {
  int32 page = 1;
  int32 limit = 2;
  int64 total = 3;
  int32 total_pages = 4;
  bool has_next = 5;
}

message StandardMetaData {
  string request_id = 1;
  string timestamp = 2;
  map<string, string> debug_data = 3;
  PaginationMeta pagination = 4;
  repeated string further_steps = 5;
}

message CheckStockRequest {
  string productId = 1;
  int32 quantity = 2;
}

message StockData {
  bool available = 1;
  int32 availableQuantity = 2;
}

message CheckStockResponse {
  bool status = 1;
  string message = 2;
  repeated ErrorItem errors = 3;
  StandardMetaData meta_data = 4;
  StockData data = 5;

  // Direct backwards-compatibility fields
  bool available = 6;
  int32 availableQuantity = 7;
}

message ReserveStockRequest {
  string productId = 1;
  int32 quantity = 2;
  string orderId = 3;
}

message ReserveStockData {
  string productId = 1;
  int32 reservedQuantity = 2;
  string orderId = 3;
}

message ReserveStockResponse {
  bool status = 1;
  string message = 2;
  repeated ErrorItem errors = 3;
  StandardMetaData meta_data = 4;
  ReserveStockData data = 5;

  // Direct backwards-compatibility fields
  bool success = 6;
}
