global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "audit-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["audit-service:4011"]
        labels:
          service: "audit-service"
          tier: "backend"

  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:4000"]
        labels:
          service: "api-gateway"
          tier: "gateway"

  - job_name: "iam-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["iam-service:4001"]
        labels:
          service: "iam-service"
          tier: "auth"

  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["order-service:4006"]
        labels:
          service: "order-service"
          tier: "commerce"

  - job_name: "transaction-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["transaction-service:4007"]
        labels:
          service: "transaction-service"
          tier: "payments"
