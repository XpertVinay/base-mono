# ==============================================================================
# ENVIRONMENT SPECIFICATION: PRODUCTION (PROD)
# Designated Folder: infra/environments/prod/
# Purpose:
#   Defines dynamic environmental variables, CI/CD secret bindings, and
#   cloud provider secret manager mappings for the 'prod' environment.
# Security:
#   - Enforces admin_cidr_blocks restriction (no 0.0.0.0/0).
#   - Relies on cloud secret managers / CI/CD secrets for high-security isolation.
# ==============================================================================

environment: prod

# ------------------------------------------------------------------------------
# 1. Non-Sensitive Dynamic Environment Defaults
# ------------------------------------------------------------------------------
variables:
  ENVIRONMENT: prod
  INFRA_PROVIDER: aws
  AWS_REGION: us-east-1
  APPLICATION_SERVER_COUNT: 3
  INSTANCE_TYPE: t3.large
  DEPLOYMENT_MODE: k8s-managed
  APP_PORT: 8080
  HOST_PORT: 80
  LOG_LEVEL: warn
  NODE_ENV: production
  ENABLE_METRICS: "true"
  PROJECT_NAME: platform
  ADMIN_CIDR_BLOCKS: '["10.0.0.0/8"]'

# ------------------------------------------------------------------------------
# 2. CI/CD Secret Name Mappings
# In production, secrets must be passed via CI/CD runners or fetched via IAM OIDC.
# ------------------------------------------------------------------------------
ci_secrets:
  AWS_ACCESS_KEY_ID: PROD_AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: PROD_AWS_SECRET_ACCESS_KEY
  AWS_SESSION_TOKEN: PROD_AWS_SESSION_TOKEN
  SSH_PUBLIC_KEY: PROD_SSH_PUBLIC_KEY
  DATABASE_URL: PROD_DATABASE_URL
  API_SECRET_KEY: PROD_API_SECRET_KEY

# ------------------------------------------------------------------------------
# 3. Cloud Provider Secret Manager Mappings
# ------------------------------------------------------------------------------
secret_managers:
  - env_var: DATABASE_URL
    provider: aws_secrets_manager
    secret_id: "prod/platform/database"
    key: "url"
    optional: false
    description: "Production Aurora/RDS database connection string"

  - env_var: API_SECRET_KEY
    provider: aws_secrets_manager
    secret_id: "prod/platform/api"
    key: "api_key"
    optional: false
    description: "Production API encryption and signing key"

  - env_var: SSH_PUBLIC_KEY
    provider: aws_ssm
    secret_id: "/prod/platform/ssh_public_key"
    optional: true
    description: "Production bastion/host public key"
