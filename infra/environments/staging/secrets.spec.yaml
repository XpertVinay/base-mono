# ==============================================================================
# ENVIRONMENT SPECIFICATION: STAGING
# Designated Folder: infra/environments/staging/
# Purpose:
#   Defines dynamic environmental variables, CI/CD secret bindings, and
#   cloud provider secret manager mappings for the 'staging' environment.
# ==============================================================================

environment: staging

# ------------------------------------------------------------------------------
# 1. Non-Sensitive Dynamic Environment Defaults
# ------------------------------------------------------------------------------
variables:
  ENVIRONMENT: staging
  INFRA_PROVIDER: aws
  AWS_REGION: us-east-1
  APPLICATION_SERVER_COUNT: 2
  INSTANCE_TYPE: t3.medium
  DEPLOYMENT_MODE: k8s-self-managed
  APP_PORT: 8080
  HOST_PORT: 80
  LOG_LEVEL: info
  NODE_ENV: staging
  ENABLE_METRICS: "true"
  PROJECT_NAME: platform
  ADMIN_CIDR_BLOCKS: '["0.0.0.0/0"]'

# ------------------------------------------------------------------------------
# 2. CI/CD Secret Name Mappings
# Maps CI/CD secret keys to target env vars.
# ------------------------------------------------------------------------------
ci_secrets:
  AWS_ACCESS_KEY_ID: STAGING_AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: STAGING_AWS_SECRET_ACCESS_KEY
  AWS_SESSION_TOKEN: STAGING_AWS_SESSION_TOKEN
  SSH_PUBLIC_KEY: STAGING_SSH_PUBLIC_KEY
  DATABASE_URL: STAGING_DATABASE_URL
  API_SECRET_KEY: STAGING_API_SECRET_KEY

# ------------------------------------------------------------------------------
# 3. Cloud Provider Secret Manager Mappings
# ------------------------------------------------------------------------------
secret_managers:
  - env_var: DATABASE_URL
    provider: aws_secrets_manager
    secret_id: "staging/platform/database"
    key: "url"
    optional: true
    description: "Staging database connection string"

  - env_var: API_SECRET_KEY
    provider: aws_secrets_manager
    secret_id: "staging/platform/api"
    key: "api_key"
    optional: true
    description: "Staging API authentication token"

  - env_var: SSH_PUBLIC_KEY
    provider: aws_ssm
    secret_id: "/staging/platform/ssh_public_key"
    optional: true
    description: "Host admin SSH public key"
