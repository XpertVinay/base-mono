# ==============================================================================
# ENVIRONMENT SPECIFICATION: DEVELOPMENT (DEV)
# Designated Folder: infra/environments/dev/
# Purpose:
#   Defines dynamic environmental variables, CI/CD secret bindings, and
#   cloud provider secret manager mappings for the 'dev' environment.
# ==============================================================================

environment: dev

# ------------------------------------------------------------------------------
# 1. Non-Sensitive Dynamic Environment Defaults
# ------------------------------------------------------------------------------
variables:
  ENVIRONMENT: dev
  INFRA_PROVIDER: aws
  AWS_REGION: us-east-1
  APPLICATION_SERVER_COUNT: 1
  INSTANCE_TYPE: t3.small
  DEPLOYMENT_MODE: docker
  APP_PORT: 8080
  HOST_PORT: 80
  LOG_LEVEL: debug
  NODE_ENV: development
  ENABLE_METRICS: "true"
  PROJECT_NAME: platform
  ADMIN_CIDR_BLOCKS: '["0.0.0.0/0"]'

# ------------------------------------------------------------------------------
# 2. CI/CD Secret Name Mappings
# Maps CI/CD secret keys (e.g., in GitHub Actions / GitLab CI) to target env vars.
# If these variables are present in the CI process environment, they take precedence.
# ------------------------------------------------------------------------------
ci_secrets:
  AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  AWS_SESSION_TOKEN: AWS_SESSION_TOKEN
  SSH_PUBLIC_KEY: DEV_SSH_PUBLIC_KEY
  DATABASE_URL: DEV_DATABASE_URL
  API_SECRET_KEY: DEV_API_SECRET_KEY

# ------------------------------------------------------------------------------
# 3. Cloud Provider Secret Manager Mappings
# Dynamically fetched from cloud secret services if not overridden by CI/CD.
# Supported Providers:
#   - aws_secrets_manager
#   - aws_ssm
#   - gcp_secret_manager
#   - azure_key_vault
#   - vault
# ------------------------------------------------------------------------------
secret_managers:
  - env_var: DATABASE_URL
    provider: aws_secrets_manager
    secret_id: "dev/platform/database"
    key: "url"
    optional: true
    description: "Application database connection string"

  - env_var: API_SECRET_KEY
    provider: aws_secrets_manager
    secret_id: "dev/platform/api"
    key: "api_key"
    optional: true
    description: "Application API authentication token"

  - env_var: SSH_PUBLIC_KEY
    provider: aws_ssm
    secret_id: "/dev/platform/ssh_public_key"
    optional: true
    description: "Host admin SSH public key"
