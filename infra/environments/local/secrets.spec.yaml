# ==============================================================================
# ENVIRONMENT SPECIFICATION: LOCAL
# Designated Folder: infra/environments/local/
# Purpose:
#   Offline workstation test environment with zero cloud costs or credentials.
#   Supports both Docker Compose and Local Kubernetes (Kind, Minikube, Docker Desktop, K3s).
# ==============================================================================

environment: local

variables:
  ENVIRONMENT: local
  INFRA_PROVIDER: local
  APPLICATION_SERVER_COUNT: 1
  DEPLOYMENT_MODE: docker
  APP_PORT: 8888
  HOST_PORT: 80
  LOG_LEVEL: debug
  NODE_ENV: local
  ENABLE_METRICS: "true"
  PROJECT_NAME: platform
  K8S_NAMESPACE: local
  K8S_NODE_PORT: "30080"
  K8S_REPLICAS: "1"

ci_secrets:
  DATABASE_URL: LOCAL_DATABASE_URL
  API_SECRET_KEY: LOCAL_API_SECRET_KEY

secret_managers: []
