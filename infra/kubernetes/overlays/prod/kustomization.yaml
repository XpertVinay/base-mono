# ==============================================================================
# KUBERNETES OVERLAY: PROD
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base
  - app-config.yaml
  - app-secrets.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: application-service
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: app
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    cpu: 1000m
                    memory: 1024Mi
