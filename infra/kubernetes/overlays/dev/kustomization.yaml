# ==============================================================================
# KUBERNETES OVERLAY: DEV
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
  - app-config.yaml
  - app-secrets.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: application-service
      spec:
        replicas: 1
