# ==============================================================================
# STANDALONE DOCKER COMPOSE DEPLOYMENT BLUEPRINT
# Purpose:
#   Runs production application workloads on standalone Docker hosts without Kubernetes.
# Operational Controls:
#   - Resource limits (CPU & Memory) to prevent noisy neighbor degradation.
#   - Explicit log rotation to prevent disk exhaustion.
#   - Non-root user execution and health checking.
# ==============================================================================
version: "3.8"

networks:
  app-network:
    driver: bridge

volumes:
  app-data:
    driver: local

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile.example
    image: ${APP_IMAGE:-platform-sample-app:local}
    container_name: ${APP_NAME:-application-service}
    restart: unless-stopped
    user: "10001:10001"
    networks:
      - app-network
    ports:
      - "${HOST_PORT:-8888}:${APP_PORT:-8888}"
    volumes:
      - app-data:/app/data
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - PORT=${APP_PORT:-8888}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${APP_PORT:-8888}/health || exit 0" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
