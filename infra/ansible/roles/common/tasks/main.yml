# ==============================================================================
# ANSIBLE ROLE: COMMON - TASKS
# Purpose:
#   Prepares host operating system baseline (Ubuntu 22.04 LTS / Debian).
# Operational Impact:
#   Configures time synchronization, kernel performance tunings, and packages.
# ==============================================================================
---
- name: Update apt cache if older than 1 hour
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Set system timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install foundational packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Enable and start chrony time synchronization
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: yes

- name: Tune system sysctl limits
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: "fs.file-max", value: "{{ sysctl_file_max }}" }
    - { key: "net.ipv4.ip_forward", value: "1" }
    - { key: "vm.max_map_count", value: "262144" }

- name: Disable swap immediately (Required for Kubernetes stability)
  ansible.builtin.command: swapoff -a
  when: disable_swap
  changed_when: false

- name: Ensure swap is disabled in /etc/fstab across reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+.*)$'
    replace: '# \1'
  when: disable_swap
