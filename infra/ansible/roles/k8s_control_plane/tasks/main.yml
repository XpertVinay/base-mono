# ==============================================================================
# ANSIBLE ROLE: K8S_CONTROL_PLANE - TASKS
# Purpose:
#   Bootstraps the Kubernetes control plane node, configures Flannel CNI, and
#   dynamically registers join credentials in-memory for worker nodes.
# Security:
#   Join tokens are stored in runtime facts only and never written to disk or git.
# ==============================================================================
---
- name: Check if Kubernetes control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_init_status

- name: Initialize Kubernetes control plane using kubeadm
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr | default('10.244.0.0/16') }}
  when: not k8s_init_status.stat.exists
  register: kubeadm_init_output

- name: Create .kube directory for ubuntu user
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('ubuntu') }}/.kube"
    state: directory
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: '0755'

- name: Copy admin.conf to user's kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user | default('ubuntu') }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: '0600'

- name: Install Flannel CNI network plugin
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f
    https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  when: not k8s_init_status.stat.exists

- name: Generate fresh cluster join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: k8s_join_cmd_raw
  changed_when: false

- name: Broadcast join command in-memory to all worker nodes
  ansible.builtin.set_fact:
    cluster_join_command: "{{ k8s_join_cmd_raw.stdout }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] }}"
