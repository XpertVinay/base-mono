# ==============================================================================
# ANSIBLE ROLE: K8S_WORKER - TASKS
# Purpose:
#   Joins worker nodes to the Kubernetes cluster using the in-memory token fact.
# ==============================================================================
---
- name: Check if node is already joined to a Kubernetes cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_worker_joined

- name: Join worker node to the Kubernetes cluster
  ansible.builtin.command: "{{ cluster_join_command }}"
  when:
    - not k8s_worker_joined.stat.exists
    - cluster_join_command is defined
