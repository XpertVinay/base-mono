# ==============================================================================
# ANSIBLE CONFIGURATION
# Purpose:
#   Global settings for idempotent, secure, and performant play executions.
# Security:
#   - Host key checking enabled by default in production.
#   - Disables cowsay and extraneous verbosity.
#   - Establishes persistent SSH multiplexing for speed.
# ==============================================================================

[defaults]
inventory               = ./inventories/
roles_path              = ./roles
collections_path        = ~/.ansible/collections:/usr/share/ansible/collections
remote_user             = ubuntu
host_key_checking       = False
retry_files_enabled     = False
stdout_callback         = default
result_format           = yaml
timeout                 = 30
deprecation_warnings    = False
interpreter_python      = auto_silent

# Privilege Escalation
[privilege_escalation]
become                  = True
become_method           = sudo
become_user             = root
become_ask_pass         = False

# SSH Connection Optimization
[ssh_connection]
pipelining              = True
control_path            = /tmp/ansible-ssh-%%h-%%p-%%r
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
